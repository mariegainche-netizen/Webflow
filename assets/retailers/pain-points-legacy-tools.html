<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: transparent;
    --card: #ffffff;
    --border: #e4e9e5;
    --fg: #1b1f1c;
    --muted: #6f7a71;
    --red: #b02a20;
    --arrow: #9aa8a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--fg); }
  .stage { padding: 32px; width: 760px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(20, 40, 30, 0.04);
    min-height: 66px;
  }
  .card .icon { color: #3a4640; flex-shrink: 0; display: flex; }
  .card .icon svg { width: 20px; height: 20px; }
  .card .text { flex: 1; min-width: 0; }
  .card .title { font-size: 15px; font-weight: 700; line-height: 1.2; color: var(--fg); }
  .card .sub { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  .badge {
    flex-shrink: 0;
    min-width: 28px; height: 28px; padding: 0 8px;
    background: var(--red); color: #fff;
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .arrow-wrap { display: flex; justify-content: center; margin-top: 14px; color: var(--arrow); }
  .arrow-wrap svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid">
      <!-- Column 1 : Email -->
      <div class="card">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </span>
        <div class="text">
          <div class="title">Email thread</div>
          <div class="sub">42 unread</div>
        </div>
        <span class="badge">42</span>
      </div>

      <!-- Column 2 : Spreadsheet -->
      <div class="card">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        </span>
        <div class="text">
          <div class="title">Spreadsheet</div>
          <div class="sub">v14_final_FINAL.xlsx</div>
        </div>
      </div>

      <!-- Column 1 : Phone -->
      <div class="card">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <div class="text">
          <div class="title">Phone call</div>
          <div class="sub">09:12 — Supplier B</div>
        </div>
        <span class="badge">2</span>
      </div>

      <!-- Column 2 : Messages -->
      <div class="card">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <div class="text">
          <div class="title">Messages</div>
          <div class="sub">3 chats open</div>
        </div>
        <span class="badge">3</span>
      </div>

      <!-- Column 1 : ERP -->
      <div class="card">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
        </span>
        <div class="text">
          <div class="title">ERP export</div>
          <div class="sub">Stale since Monday</div>
        </div>
        <span class="badge">!</span>
      </div>
    </div>

    <div class="arrow-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>
      </svg>
    </div>
  </div>
</body>
</html>
