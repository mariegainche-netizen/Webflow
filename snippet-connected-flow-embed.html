<!-- ============================================================
     CONNECTED FLOW — Embed pour Webflow (section Home 2)
     ============================================================
     À COLLER dans un unique Embed placé DANS ta section vide.
     Poids : < 500 caractères. Aucune limite Webflow atteinte.

     Ce que fait ce bloc :
      1) Charge le CSS scopé (.cflow)
      2) Charge le script qui va fetch le HTML de la section
         et l'injecter dans <div data-cflow-mount>
      3) Le script démarre l'auto-play quand la section est visible
         (IntersectionObserver, 4,5 s par étape, boucle infinie)

     Cache jsDelivr : ~12 h sur branche. Après un update,
     ajouter ?v=2 (etc.) à la fin de chaque URL pour forcer
     le refresh chez les visiteurs déjà venus.
     ============================================================ -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mariegainche-netizen/Webflow@claude/wizardly-cannon-xpo6is/assets/connected-flow.min.css">
<div data-cflow-mount></div>
<script src="https://cdn.jsdelivr.net/gh/mariegainche-netizen/Webflow@claude/wizardly-cannon-xpo6is/assets/connected-flow.min.js" defer></script>
